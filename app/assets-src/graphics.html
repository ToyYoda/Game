<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lichtschlinge Grafiken</title>
<style>
@font-face { font-family: "Unbounded"; font-weight: 800; src: url("../node_modules/@fontsource/unbounded/files/unbounded-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Chakra Petch"; font-weight: 600; src: url("../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-600-normal.woff2") format("woff2"); }
html, body { margin: 0; background: transparent; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Erzeugt Icon und Store-Grafiken. Aufruf: graphics.html?kind=icon|fg|scene|logo&w=…&h=…&logo=1&seed=…
const q = new URLSearchParams(location.search);
const kind = q.get('kind') || 'scene', W = +q.get('w') || 1024, H = +q.get('h') || 1024, withLogo = q.get('logo') === '1';
let seed = +q.get('seed') || 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;

function background(x, y, w, h) {
  ctx.fillStyle = '#06040f'; ctx.fillRect(x, y, w, h);
  const g = ctx.createRadialGradient(x + w * 0.5, y + h * 0.45, 0, x + w * 0.5, y + h * 0.45, Math.max(w, h) * 0.75);
  g.addColorStop(0, 'rgba(60, 24, 120, 0.75)'); g.addColorStop(0.6, 'rgba(20, 10, 48, 0.4)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
}
function grid(w, h, gs, cx, cy, bulge) {
  ctx.strokeStyle = 'rgba(120, 90, 255, 0.18)'; ctx.lineWidth = Math.max(1, gs / 40);
  const warp = (x, y) => { const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1, f = bulge * Math.exp(-d * d / (2 * (gs * 4) ** 2)); return [x + dx / d * f, y + dy / d * f]; };
  ctx.beginPath();
  for (let y = -gs; y <= h + gs; y += gs) for (let x = -gs; x <= w + gs; x += gs / 4) { const [a, b] = warp(x, y); x === -gs ? ctx.moveTo(a, b) : ctx.lineTo(a, b); }
  for (let x = -gs; x <= w + gs; x += gs) for (let y = -gs; y <= h + gs; y += gs / 4) { const [a, b] = warp(x, y); y === -gs ? ctx.moveTo(a, b) : ctx.lineTo(a, b); }
  ctx.stroke();
}
function stars(w, h, n) {
  for (let i = 0; i < n; i++) { ctx.fillStyle = `rgba(200,190,255,${0.15 + rnd() * 0.5})`; const s = rnd() * 2 + 0.5; ctx.fillRect(rnd() * w, rnd() * h, s, s); }
}
// Die Schlinge: Schweif mit Farbverlauf, der sich zu einer Schleife schließt
function lasso(cx, cy, r, scale, glowPass) {
  const pts = [];
  const n = 140;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    let x, y;
    if (t < 0.35) { const u = t / 0.35; x = cx - r * 2.3 + u * r * 1.6; y = cy + r * 1.25 - Math.sin(u * Math.PI * 0.9) * r * 0.55 + u * r * 0.1; }
    else { const u = (t - 0.35) / 0.65, a = Math.PI * 0.82 + u * TAU * 1.04; x = cx + Math.cos(a) * r * (1 + 0.06 * Math.sin(u * 9)); y = cy + Math.sin(a) * r * 0.92; }
    pts.push([x, y]);
  }
  ctx.lineCap = glowPass ? 'round' : 'butt'; ctx.lineJoin = 'round';
  for (let i = 1; i < pts.length; i++) {
    const k = i / (pts.length - 1);
    ctx.strokeStyle = hsl(190 + k * 140, 100, glowPass ? 60 : 66, glowPass ? 0.35 : 0.25 + 0.75 * k);
    ctx.lineWidth = (glowPass ? 10 : 2) * scale + k * (glowPass ? 18 : 7) * scale;
    ctx.beginPath(); ctx.moveTo(pts[i - 1][0], pts[i - 1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
  }
  return pts[pts.length - 1];
}
function light(x, y, r) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(200,250,255,0.95)'); g.addColorStop(1, 'rgba(79,240,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, TAU); ctx.fill();
}
function enemy(type, x, y, r, rot) {
  const hue = { seeker: 330, drifter: 185, dasher: 48, cutter: 8, bomb: 275 }[type];
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  if (type === 'seeker') { ctx.moveTo(r * 1.3, 0); ctx.lineTo(Math.cos(2.5) * r, Math.sin(2.5) * r); ctx.lineTo(-r * 0.4, 0); ctx.lineTo(Math.cos(-2.5) * r, Math.sin(-2.5) * r); }
  else { const c = type === 'drifter' ? 4 : type === 'bomb' ? 6 : type === 'cutter' ? 10 : 4; for (let i = 0; i < c; i++) { const a = i * TAU / c, rr = type === 'cutter' && i % 2 ? r * 0.45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } }
  ctx.closePath();
  ctx.fillStyle = hsl(hue, 100, 55, 0.2); ctx.fill();
  ctx.shadowColor = hsl(hue, 100, 60); ctx.shadowBlur = r * 1.2;
  ctx.lineWidth = Math.max(2, r * 0.22); ctx.strokeStyle = hsl(hue, 100, 68); ctx.stroke();
  ctx.restore();
}
function sparks(cx, cy, r, n, hue) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, d = r * (0.2 + rnd() * 0.9), l = r * (0.04 + rnd() * 0.1);
    ctx.strokeStyle = hsl(hue + rnd() * 40, 100, 70, 0.5 + rnd() * 0.5); ctx.lineWidth = Math.max(1, r * 0.012);
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d); ctx.lineTo(cx + Math.cos(a) * (d + l), cy + Math.sin(a) * (d + l)); ctx.stroke();
  }
}
function title(x, y, size, align, maxW) {
  ctx.save();
  ctx.font = `800 100px Unbounded`;
  if (maxW) size = Math.min(size, maxW / ctx.measureText('LICHTSCHLINGE').width * 100);
  ctx.font = `800 ${size}px Unbounded`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  const m = ctx.measureText('LICHTSCHLINGE'), tw = m.width;
  const x0 = align === 'left' ? x : x - tw / 2;
  const g = ctx.createLinearGradient(x0, 0, x0 + tw, 0);
  g.addColorStop(0.05, '#4ff0ff'); g.addColorStop(0.55, '#ff4fa8'); g.addColorStop(0.97, '#ffd84f');
  ctx.shadowColor = 'rgba(255,79,168,0.6)'; ctx.shadowBlur = size * 0.45;
  ctx.fillStyle = g; ctx.fillText('LICHTSCHLINGE', x, y);
  ctx.shadowBlur = 0; ctx.fillText('LICHTSCHLINGE', x, y);
  ctx.restore();
  return tw;
}
function scene(w, h, opts) {
  background(0, 0, w, h);
  const s = Math.min(w, h);
  stars(w, h, Math.round(w * h / 6000));
  const cx = opts.cx * w, cy = opts.cy * h, r = s * opts.r;
  grid(w, h, s / 12, cx, cy, s * 0.04);
  ctx.globalCompositeOperation = 'lighter';
  // Fang im Inneren: aufleuchtende Fläche, Gegner, Funken
  ctx.fillStyle = 'rgba(255, 79, 168, 0.10)';
  ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.92, 0, 0, TAU); ctx.fill();
  sparks(cx, cy, r, 70, 300);
  const inside = [['drifter', -0.35, -0.2], ['seeker', 0.25, -0.35], ['bomb', 0.05, 0.12], ['drifter', 0.4, 0.25], ['seeker', -0.25, 0.35]];
  for (const [t, dx, dy] of inside) enemy(t, cx + dx * r, cy + dy * r, r * (t === 'bomb' ? 0.13 : 0.085), rnd() * TAU);
  lasso(cx, cy, r, s / 900, true);
  const head = lasso(cx, cy, r, s / 900, false);
  light(head[0], head[1], s * 0.022);
  if (opts.outside) {
    const outside = [['seeker', 0.86, 0.2], ['dasher', 0.12, 0.8], ['cutter', 0.9, 0.82], ['seeker', 0.18, 0.18], ['drifter', 0.7, 0.9]];
    // Im Hochformat mit Schriftzug bleibt das obere Drittel frei
    const top = opts.logoTop ? 0.3 : 0;
    for (const [t, fx, fy] of outside) enemy(t, fx * w, (top + fy * (1 - top)) * h, s * 0.022, rnd() * TAU);
  }
  ctx.globalCompositeOperation = 'source-over';
}

document.fonts.load('800 40px Unbounded').then(() => {
  if (kind === 'icon' || kind === 'fg') {
    // Icon: Schlinge mit Licht; fg = transparenter Vordergrund für das adaptive Android-Icon (Inhalt im inneren Kreis)
    if (kind === 'icon') background(0, 0, W, H); else ctx.clearRect(0, 0, W, H);
    if (kind === 'icon') grid(W, H, W / 7, W * 0.55, H * 0.5, W * 0.05);
    const k = kind === 'fg' ? 0.62 : 1, cx = W * (0.5 + 0.05 * k), cy = H * 0.47, r = W * 0.3 * k;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 79, 168, 0.12)'; ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.92, 0, 0, TAU); ctx.fill();
    enemy('seeker', cx - r * 0.2, cy - r * 0.1, r * 0.2, -0.6);
    enemy('drifter', cx + r * 0.3, cy + r * 0.25, r * 0.15, 0.4);
    lasso(cx, cy, r, W / 520 * k, true);
    const head = lasso(cx, cy, r, W / 520 * k, false);
    light(head[0], head[1], W * 0.035 * k);
    ctx.globalCompositeOperation = 'source-over';
  } else if (kind === 'logo') {
    ctx.clearRect(0, 0, W, H);
    title(W / 2, H / 2, W, 'center', W * 0.9);
  } else {
    const wide = W / H;
    const opts = wide > 1.6 ? { cx: withLogo ? 0.76 : 0.62, cy: 0.52, r: withLogo ? 0.3 : 0.32, outside: true }
      : wide > 1.05 ? { cx: 0.62, cy: withLogo ? 0.58 : 0.5, r: 0.3, outside: true }
      : { cx: 0.52, cy: withLogo ? 0.6 : 0.5, r: 0.26, outside: true };
    opts.logoTop = withLogo && wide <= 1.6;
    scene(W, H, opts);
    if (withLogo) {
      if (wide > 1.6) title(W * 0.05, H * 0.5, H * 0.2, 'left', W * 0.5);
      else title(W / 2, H * 0.17, H * 0.12, 'center', W * 0.88);
    }
  }
  document.title = 'fertig';
});
</script>
</body>
</html>

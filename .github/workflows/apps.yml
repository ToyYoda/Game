name: Apps

# Baut die Steam-Fassung (Windows, Linux) und die Android-App.
# Ohne Signatur-Secrets entsteht eine Test-APK; mit Secrets zusätzlich das signierte Play-Store-Paket (.aab).
on:
  push:
    branches: [main]
    paths: ['src/**', 'app/**', 'music/**', '.github/workflows/apps.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: lichtschlinge-steam-${{ matrix.target }}
          path: app/dist/${{ matrix.target }}-unpacked/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - name: Test-APK bauen
        working-directory: app/android
        env:
          LS_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Signiertes Play-Store-Paket bauen (nur mit Secrets)
        working-directory: app/android
        env:
          LS_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Keine Signatur-Secrets hinterlegt – überspringe das Play-Store-Paket."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          LS_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lichtschlinge-android
          path: |
            app/android/app/build/outputs/apk/debug/*.apk
            app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
